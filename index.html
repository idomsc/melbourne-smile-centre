<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Melbourne Smile Centre · Toorak</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo-msc-mark.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="colors_and_type.css">
  <style>
    html, body { margin: 0; }
    body { background: var(--msc-canvas); }
    a { cursor: pointer; }
    * { box-sizing: border-box; }

    /* ── Scroll reveal ── */
    .reveal {
      opacity: 0;
      transform: translateY(22px);
      transition: opacity 560ms cubic-bezier(0.4, 0, 0.2, 1),
                  transform 560ms cubic-bezier(0.4, 0, 0.2, 1);
    }
    .reveal.revealed {
      opacity: 1;
      transform: translateY(0);
    }

    /* ── Scroll hint line ── */
    @keyframes scrollHint {
      0%   { opacity: 0; transform: scaleY(0); transform-origin: top; }
      40%  { opacity: 1; transform: scaleY(1); transform-origin: top; }
      80%  { opacity: 0; transform: scaleY(1); transform-origin: bottom; }
      100% { opacity: 0; }
    }

    /* ── Button press ── */
    button:active { transform: scale(0.95) !important; }

    /* ── Hover reactions ── */
    .hover-lift {
      transition: transform 300ms cubic-bezier(0.4, 0, 0.2, 1),
                  box-shadow 300ms cubic-bezier(0.4, 0, 0.2, 1);
    }
    .hover-lift:hover {
      transform: translateY(-4px);
      box-shadow: 0 16px 40px -8px rgba(176,135,84,0.22);
    }
    .hover-glow {
      transition: box-shadow 300ms cubic-bezier(0.4, 0, 0.2, 1),
                  transform 300ms cubic-bezier(0.4, 0, 0.2, 1);
    }
    .hover-glow:hover {
      box-shadow: 0 0 0 1px rgba(176,135,84,0.4),
                  0 8px 32px -4px rgba(176,135,84,0.28);
      transform: translateY(-2px);
    }
    .hover-scale img {
      transition: transform 500ms cubic-bezier(0.4, 0, 0.2, 1);
    }
    .hover-scale:hover img {
      transform: scale(1.04);
    }
    .hover-bronze {
      transition: color 200ms ease, opacity 200ms ease;
    }
    .hover-bronze:hover { color: var(--msc-primary) !important; }

    /* ── Magnetic cursor tilt on photo cards ── */
    .tilt-card {
      transition: transform 400ms cubic-bezier(0.4, 0, 0.2, 1);
      transform-style: preserve-3d;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

  <script type="text/babel" src="Buttons.jsx?v=2"></script>
  <script type="text/babel" src="Nav.jsx?v=2"></script>
  <script type="text/babel" src="Tile.jsx?v=2"></script>
  <script type="text/babel" src="TreatmentGrid.jsx?v=2"></script>
  <script type="text/babel" src="Footer.jsx?v=2"></script>
  <script type="text/babel" src="Pages.jsx?v=2"></script>

  <script type="text/babel">
    const { useState } = React;

    function App() {
      const [page, setPage] = useState("home");

      const handleNavigate = (id) => {
        setPage(id);
        window.scrollTo({ top: 0, behavior: "smooth" });
      };

      return (
        <div>
          <GlassNav onNavigate={handleNavigate} current={page} />

          {page === "home"        && <HomePage onNavigate={handleNavigate} />}
          {page === "treatments"  && <TreatmentsPage onNavigate={handleNavigate} />}
          {page === "environment" && <EnvironmentPage />}
          {page === "team"        && <TeamPage />}
          {page === "patients"    && <PatientsPage />}
          {page === "contact"     && <ContactPage />}

          <Footer />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
